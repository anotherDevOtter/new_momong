<!doctype html><meta charset="utf-8"><body><script type="module">
import { FilesetResolver, FaceLandmarker } from 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.35/vision_bundle.mjs';
window.run = async (names) => {
  const vision = await FilesetResolver.forVisionTasks('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.35/wasm');
  const lmk = await FaceLandmarker.createFromOptions(vision, {
    baseOptions: { modelAssetPath: 'https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task', delegate: 'CPU' },
    runningMode: 'IMAGE', numFaces: 1 });
  const out = {};
  for (const n of names) {
    const img = await new Promise((res, rej) => { const el = new Image(); el.onload = () => res(el); el.onerror = rej; el.src = '/img/' + n; });
    const r = lmk.detect(img);
    const f = r.faceLandmarks?.[0];
    out[n] = { width: img.naturalWidth, height: img.naturalHeight, landmarks: f ? f.map(p => [p.x, p.y, p.z]) : null };
  }
  return out;
};
window.ready = true;
</script>
