<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>얼굴 정밀 분석</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<style>
  :root{
    --ink:#1A1A1A;--sub:#6E6E6B;--faint:#A6A6A2;
    --line:#E8E8E4;--line-2:#DDDDD8;--rail:#F7F7F5;--paper:#FFFFFF;
    --sans:'Pretendard',-apple-system,'Apple SD Gothic Neo',system-ui,sans-serif;
    --mono:'JetBrains Mono',ui-monospace,monospace;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{font-family:var(--sans);color:var(--ink);background:var(--paper);
    -webkit-font-smoothing:antialiased;line-height:1.5;overflow:hidden}
  .page{height:100vh;display:flex;flex-direction:column}

  /* ===== HEADER ===== */
  .hd{flex:0 0 auto;padding:22px 34px 0;background:var(--paper)}
  .step-tag{font-family:var(--mono);font-size:11px;letter-spacing:.16em;color:var(--faint)}
  .hd h1{font-size:26px;font-weight:600;letter-spacing:-.025em;margin-top:6px}
  .tabs{display:flex;gap:0;margin-top:18px;border-bottom:1px solid var(--line)}
  .tab{position:relative;background:none;border:none;cursor:pointer;padding:12px 20px 14px;
    font-size:14.5px;font-weight:500;color:var(--faint);letter-spacing:-.01em;transition:color .2s}
  .tab:first-child{padding-left:0}
  .tab:hover{color:var(--sub)}
  .tab.on{color:var(--ink);font-weight:600}
  .tab::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:2px;background:var(--ink);
    transform:scaleX(0);transition:transform .25s ease;transform-origin:left}
  .tab:first-child::after{left:0;right:20px}
  .tab.on::after{transform:scaleX(1)}

  /* ===== GRID ===== */
  .grid{flex:1 1 auto;display:grid;grid-template-columns:262px minmax(0,1fr) 392px;
    gap:0;min-height:0;padding:20px 34px 24px}

  /* --- LEFT RAIL --- */
  .rail{background:var(--rail);border:1px solid var(--line);border-radius:3px;
    overflow-y:auto;padding:22px 0}
  .rail-lab{font-family:var(--mono);font-size:10px;letter-spacing:.2em;color:var(--faint);
    padding:0 22px 12px;text-transform:uppercase}
  .zone-i{width:calc(100% - 24px);margin:0 12px 3px;text-align:left;background:none;border:none;cursor:pointer;
    display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:3px;transition:background .18s}
  .zone-i:hover{background:rgba(0,0,0,.035)}
  .zone-i:focus-visible{outline:2px solid var(--ink);outline-offset:-2px}
  .zone-i.on{background:var(--paper);box-shadow:0 1px 3px rgba(0,0,0,.06)}
  .z-num{font-family:var(--mono);font-size:11px;color:var(--faint);width:16px;flex:0 0 auto}
  .zone-i.on .z-num{color:var(--ink)}
  .z-name{font-size:13.5px;font-weight:500;flex:1 1 auto;color:var(--sub);letter-spacing:-.01em}
  .zone-i.on .z-name{color:var(--ink);font-weight:600}
  .z-cnt{font-size:12px;color:var(--faint);flex:0 0 auto}
  .rail-div{height:1px;background:var(--line);margin:22px 22px 20px}
  .step-i{width:calc(100% - 24px);margin:0 12px 2px;text-align:left;background:none;border:none;cursor:pointer;
    padding:11px 14px;border-radius:3px;font-size:13.5px;color:var(--sub);letter-spacing:-.01em;
    transition:all .18s;display:flex;align-items:center;gap:9px}
  .step-i:hover{background:rgba(0,0,0,.035);color:var(--ink)}
  .step-i:focus-visible{outline:2px solid var(--ink);outline-offset:-2px}
  .step-i.on{background:var(--ink);color:#fff;font-weight:500}
  .s-idx{font-family:var(--mono);font-size:12px;opacity:.75;flex:0 0 auto}

  /* --- CENTER --- */
  .center{background:var(--paper);border-top:1px solid var(--line);border-bottom:1px solid var(--line);
    display:flex;flex-direction:column;min-height:0;padding:22px 30px 18px;position:relative}
  .c-top{display:flex;align-items:center;justify-content:space-between;flex:0 0 auto}
  .analyzing{display:flex;align-items:center;gap:10px;font-family:var(--mono);font-size:12px;
    letter-spacing:.2em;font-weight:600}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--ink);animation:pulse 2.4s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
  .c-zone{font-family:var(--mono);font-size:11.5px;letter-spacing:.18em;color:var(--faint)}
  .c-zone b{color:var(--ink);font-weight:500}
  .c-face{flex:1 1 auto;display:flex;align-items:center;justify-content:center;min-height:0;padding:16px 0 10px}
  .facewrap{position:relative;height:100%;max-height:100%;aspect-ratio:1414/2000;background:#F0F0EE}
  .facewrap img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;z-index:1}
  .overlay{position:absolute;inset:0;width:100%;height:100%;z-index:2;pointer-events:none;
    filter:drop-shadow(0 0 2px rgba(255,255,255,.95)) drop-shadow(0 0 3px rgba(255,255,255,.5))}
  .c-cap{flex:0 0 auto;text-align:center;font-size:12px;color:var(--faint);letter-spacing:-.01em}

  .ov{opacity:0;transition:opacity .3s ease}
  .ov.on{opacity:1}
  .guide{opacity:0;transition:opacity .3s}
  .guide.on{opacity:1}
  .ol{stroke:var(--ink);stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round}
  .od{stroke:var(--ink);stroke-width:2;fill:none;stroke-dasharray:5 7;opacity:.6;stroke-linecap:round}
  .og{stroke:#fff;stroke-width:2;fill:none;stroke-dasharray:4 9;opacity:.75;mix-blend-mode:difference}
  .nd{fill:#fff;stroke:var(--ink);stroke-width:3}
  .ndf{fill:var(--ink);stroke:#fff;stroke-width:2}
  .chip{fill:var(--ink)}
  .chip-t{font-family:var(--mono);font-size:23px;fill:#fff;letter-spacing:.02em;font-weight:500}
  .draw{stroke-dasharray:1;stroke-dashoffset:1}
  .ov.on .draw{animation:draw .65s ease forwards}
  @keyframes draw{to{stroke-dashoffset:0}}
  .pop{transform-box:fill-box;transform-origin:center;transform:scale(0)}
  .ov.on .pop{animation:pop .38s cubic-bezier(.2,1.4,.4,1) forwards}
  .ov.on .pop.d1{animation-delay:.26s}
  .ov.on .pop.d2{animation-delay:.36s}
  @keyframes pop{to{transform:scale(1)}}
  .fade-in{opacity:0}
  .ov.on .fade-in{animation:fadeIn .45s ease .36s forwards}
  @keyframes fadeIn{to{opacity:1}}

  .guide-btn{position:absolute;bottom:52px;left:30px;display:flex;align-items:center;gap:9px;cursor:pointer;
    user-select:none;font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;color:var(--sub);
    background:rgba(255,255,255,.78);padding:6px 11px;border-radius:20px;backdrop-filter:blur(4px)}
  .switch{width:30px;height:16px;border-radius:20px;background:var(--line-2);position:relative;transition:background .2s;flex:0 0 auto}
  .switch::after{content:"";position:absolute;top:2px;left:2px;width:12px;height:12px;border-radius:50%;
    background:#fff;transition:transform .2s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
  .guide-btn.on .switch{background:var(--ink)}
  .guide-btn.on .switch::after{transform:translateX(14px)}

  /* --- RIGHT PANEL --- */
  .side{background:var(--paper);border-left:1px solid var(--line);display:flex;flex-direction:column;
    min-height:0;padding:22px 0 0 30px}
  .side-lab{font-family:var(--mono);font-size:11px;letter-spacing:.14em;color:var(--faint);flex:0 0 auto}
  .side h2{font-size:20px;font-weight:600;letter-spacing:-.02em;margin-top:9px;flex:0 0 auto}
  .side-list{flex:1 1 auto;overflow-y:auto;margin-top:22px;padding-right:24px}
  .mi{padding:0 0 22px;cursor:pointer;border:none;background:none;text-align:left;width:100%;display:block}
  .mi:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
  .mi-name{font-size:14.5px;font-weight:600;letter-spacing:-.01em;color:var(--faint);transition:color .2s}
  .mi.on .mi-name{color:var(--ink)}
  .mi-val{font-size:12.5px;color:var(--sub);margin-top:5px}
  .mi-val b{font-weight:600;color:var(--ink)}
  .bar{height:4px;background:var(--line);border-radius:4px;margin:11px 0 7px;position:relative;overflow:hidden}
  .bar i{position:absolute;left:0;top:0;bottom:0;background:var(--line-2);border-radius:4px;
    width:0;transition:width .55s cubic-bezier(.4,0,.2,1)}
  .mi.on .bar i{background:var(--ink)}
  .bar-poles{display:flex;justify-content:space-between;font-size:11px;color:var(--faint)}
  .side-foot{flex:0 0 auto;border-top:1px solid var(--line);margin-right:24px;padding:18px 0 20px}
  .sf-lab{font-family:var(--mono);font-size:10px;letter-spacing:.18em;color:var(--faint);text-transform:uppercase}

  /* 이미지 영향 */
  .infl{padding-bottom:16px}
  .infl-txt{font-size:13.5px;letter-spacing:-.01em;margin-top:9px;line-height:1.55}

  /* 대표 성향 */
  .tend{background:var(--rail);border-radius:4px;padding:16px 17px 17px;margin-top:2px}
  .tend-lab{font-family:var(--mono);font-size:10px;letter-spacing:.18em;color:var(--faint);text-transform:uppercase}
  .tend-v{font-size:25px;font-weight:600;letter-spacing:-.02em;margin-top:7px;line-height:1}
  .tags{display:flex;flex-wrap:wrap;gap:8px;margin-top:9px;font-size:11.5px;color:var(--sub)}
  .dist{margin-top:14px;display:flex;flex-direction:column;gap:8px}
  .dr{display:flex;align-items:center;gap:10px}
  .dr-n{width:56px;flex:0 0 auto;font-size:11.5px;font-weight:500;color:var(--sub)}
  .dr.lead .dr-n{color:var(--ink);font-weight:600}
  .dr-b{flex:1 1 auto;height:6px;background:var(--line);border-radius:6px;position:relative;overflow:hidden}
  .dr-b i{position:absolute;left:0;top:0;bottom:0;border-radius:6px;background:var(--line-2);
    width:0;transition:width .5s cubic-bezier(.4,0,.2,1)}
  .dr.lead .dr-b i{background:var(--ink)}
  .dr-p{width:38px;flex:0 0 auto;text-align:right;font-family:var(--mono);font-size:11.5px;color:var(--sub)}
  .dr.lead .dr-p{color:var(--ink);font-weight:600}

  /* status row */
  .sf-status{display:flex;align-items:center;justify-content:space-between;gap:12px;
    margin-top:16px;padding-top:15px;border-top:1px solid var(--line)}
  .sf-btn{background:var(--ink);color:#fff;border:none;border-radius:2px;
    font-size:12.5px;font-weight:500;padding:9px 17px;cursor:pointer;letter-spacing:-.01em;flex:0 0 auto}

  /* summary zone */
  .sum-card{border:1px solid var(--line);border-radius:3px;padding:20px;margin-bottom:14px}
  .sc-top{display:flex;align-items:baseline;justify-content:space-between}
  .sc-name{font-size:14.5px;font-weight:600}
  .sc-v{font-family:var(--mono);font-size:12px;letter-spacing:.08em;border:1px solid var(--ink);padding:3px 9px;border-radius:2px}
  .sc-num{font-family:var(--mono);font-size:38px;font-weight:600;letter-spacing:-.03em;line-height:1;margin-top:14px}
  .sc-sub{font-family:var(--mono);font-size:10.5px;color:var(--faint);letter-spacing:.06em;margin-top:8px}
  .sc-bar{height:4px;background:var(--line);border-radius:4px;margin-top:14px;position:relative}
  .sc-bar i{position:absolute;left:0;top:0;bottom:0;background:var(--ink);border-radius:4px;transition:width .6s ease}


  /* ===== 3×3 이미지 맵 · 추구 이미지 ===== */
  .map-sec{margin-bottom:20px}
  .map-lab{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px}
  .map-lab i{font-family:var(--mono);font-size:10px;letter-spacing:.14em;color:var(--faint);font-style:normal}
  .map-lab b{font-weight:400;color:var(--sub);font-size:11px}
  .imap{display:grid;grid-template-columns:22px repeat(3,1fr);border:1px solid var(--line);border-radius:3px;overflow:hidden}
  .imap .corner{background:var(--rail)}
  .imap .hd{font-family:var(--mono);font-size:9px;letter-spacing:.1em;color:var(--faint);background:var(--rail);text-align:center;padding:7px 0;border-left:1px solid var(--line)}
  .imap .vd{font-family:var(--mono);font-size:9px;letter-spacing:.1em;color:var(--faint);background:var(--rail);display:flex;align-items:center;justify-content:center;writing-mode:vertical-rl;border-top:1px solid var(--line)}
  .cellb{position:relative;background:var(--paper);border:0;border-left:1px solid var(--line);border-top:1px solid var(--line);padding:17px 4px 15px;cursor:pointer;font:inherit;text-align:center;transition:background .18s}
  .cellb:hover{background:var(--rail)}
  .cellb .en{font-family:var(--mono);font-size:10.5px;letter-spacing:.07em;font-weight:600;color:var(--ink)}
  .cellb .ko{font-size:10.5px;color:var(--sub);margin-top:3px}
  .cellb.cur{background:var(--ink)}
  .cellb.cur .en,.cellb.cur .ko{color:#fff}
  .cellb.tgt{box-shadow:inset 0 0 0 2px var(--ink)}
  .cellb .mk{position:absolute;top:5px;right:5px;font-size:8.5px;letter-spacing:.04em;border:1px solid var(--ink);border-radius:2px;padding:1px 4px;color:var(--ink);background:var(--paper);line-height:1.4}
  .cellb.cur .mk{border-color:#fff;color:#fff;background:transparent}
  .dir-card{border:1px solid var(--ink);border-radius:3px;padding:18px 20px;margin-bottom:14px}
  .dir-card.idle{border-color:var(--line)}
  .dir-top{display:flex;align-items:center;justify-content:space-between;gap:10px}
  .dir-mode{font-family:var(--mono);font-size:11.5px;letter-spacing:.13em;font-weight:600}
  .dir-badge{font-size:11.5px;color:#fff;background:var(--ink);border-radius:2px;padding:4px 11px}
  .dir-card.idle .dir-badge{background:var(--line);color:var(--sub)}
  .dir-path{font-family:var(--mono);font-size:10px;color:var(--faint);letter-spacing:.05em;margin-top:11px;line-height:1.6}
  .dir-txt{font-size:12.5px;line-height:1.75;color:var(--sub);margin-top:12px}
  .dir-ax{border-top:1px solid var(--line);margin-top:15px;padding-top:13px;display:flex;flex-direction:column;gap:11px}
  .dir-ax p{display:flex;gap:10px;font-size:12px;line-height:1.65;margin:0}
  .dir-ax b{flex:0 0 52px;font-weight:600;color:var(--ink);font-size:11.5px}
  .dir-ax span{color:var(--sub)}
  .dir-hint{font-size:11.5px;color:var(--faint);line-height:1.75;margin-top:13px;padding-top:12px;border-top:1px dashed var(--line)}

  /* ===== 결과 도출 · 센터 이미지 맵 ===== */
  .c-summary{flex:1 1 auto;display:flex;flex-direction:column;justify-content:center;min-height:0;padding:10px 8px 18px}
  .bm-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:16px}
  .bm-head i{font-family:var(--mono);font-size:10.5px;letter-spacing:.16em;color:var(--faint);font-style:normal}
  .bm-head b{font-weight:400;font-size:11.5px;color:var(--sub)}
  .bmap{display:flex;gap:10px;flex:0 1 auto;min-height:0}
  .bm-ylab{display:flex;flex-direction:column;width:20px;flex:0 0 20px}
  .bm-ylab span{flex:1;display:flex;align-items:center;justify-content:center;writing-mode:vertical-rl;
    font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;color:var(--faint)}
  .bm-main{flex:1 1 auto;display:flex;flex-direction:column;min-width:0}
  .bm-xlab{display:grid;grid-template-columns:repeat(3,1fr);margin-bottom:8px}
  .bm-xlab span{text-align:center;font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;color:var(--faint)}
  .bm-plot{position:relative;flex:1 1 auto;min-height:0}
  .bm-grid{display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);
    height:100%;border:1px solid var(--line-2);border-radius:3px;overflow:hidden}
  .bcell{position:relative;background:var(--paper);border:0;border-left:1px solid var(--line);border-top:1px solid var(--line);
    cursor:pointer;font:inherit;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;
    padding:10px 6px;transition:background .18s}
  .bm-grid .bcell:nth-child(3n+1){border-left:0}
  .bm-grid .bcell:nth-child(-n+3){border-top:0}
  .bcell:hover{background:var(--rail)}
  .bcell .en{font-family:var(--mono);font-size:14px;letter-spacing:.1em;font-weight:600;color:var(--ink)}
  .bcell .ko{font-size:12.5px;color:var(--sub)}
  .bcell.cur{background:var(--ink)}
  .bcell.cur .en,.bcell.cur .ko{color:#fff}
  .bcell.tgt{box-shadow:inset 0 0 0 2px var(--ink)}
  .bcell .mk{position:absolute;top:9px;right:9px;font-size:9.5px;letter-spacing:.04em;line-height:1.5;
    border:1px solid var(--ink);border-radius:2px;padding:1px 6px;color:var(--ink);background:var(--paper)}
  .bcell.cur .mk{border-color:#fff;color:#fff;background:transparent}
  .bm-pin{position:absolute;width:13px;height:13px;border-radius:50%;background:#fff;border:3px solid var(--ink);
    transform:translate(-50%,-50%);pointer-events:none;z-index:3;transition:left .5s ease,top .5s ease}
  .bm-pin::after{content:'';position:absolute;left:50%;top:50%;width:34px;height:34px;border-radius:50%;
    border:1px solid var(--ink);opacity:.32;transform:translate(-50%,-50%)}
  .bm-cap{flex:0 0 auto;text-align:center;font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;color:var(--faint);margin-top:14px}

  /* ===== 결과 도출 · 사이드 ===== */
  .rs-code{font-family:var(--mono);font-size:13px;letter-spacing:.3em;color:var(--sub);border:1px solid var(--line-2);
    border-radius:2px;padding:5px 12px;display:inline-block}
  .rs-key{font-size:52px;font-weight:600;letter-spacing:-.035em;line-height:1.05;margin-top:16px;color:var(--ink)}
  .rs-en{font-family:var(--mono);font-size:13px;letter-spacing:.22em;color:var(--faint);margin-top:9px}
  .rs-desc{font-size:12.5px;line-height:1.8;color:var(--sub);margin-top:16px;padding-left:13px;border-left:2px solid var(--ink)}
  .rs-kw{display:flex;flex-wrap:wrap;gap:6px;margin-top:16px}
  .rs-kw span{font-size:11.5px;color:var(--sub);border:1px solid var(--line-2);border-radius:2px;padding:4px 9px}
  .rs-kw span.on{border-color:var(--ink);color:var(--ink);font-weight:600}
  .rs-sec{margin-top:26px}
  .rs-sec>i{display:block;font-family:var(--mono);font-size:10px;letter-spacing:.15em;color:var(--faint);font-style:normal;margin-bottom:12px}
  .rs-row{display:grid;grid-template-columns:54px 1fr 38px;align-items:center;gap:10px;margin-bottom:9px}
  .rs-row em{font-style:normal;font-size:11.5px;color:var(--sub)}
  .rs-row.lead em{color:var(--ink);font-weight:600}
  .rs-bar{height:4px;background:var(--line);border-radius:4px;position:relative}
  .rs-bar i{position:absolute;left:0;top:0;bottom:0;background:var(--line-2);border-radius:4px;transition:width .6s ease}
  .rs-row.lead .rs-bar i{background:var(--ink)}
  .rs-row b{font-family:var(--mono);font-size:11px;font-weight:600;text-align:right;color:var(--sub)}
  .rs-row.lead b{color:var(--ink)}
  .rs-div{height:1px;background:var(--line);margin:16px 0 14px}
  @media (max-width:1280px){
    .grid{grid-template-columns:230px minmax(0,1fr) 330px;padding:16px 20px 20px}
    .side{padding-left:22px}
  }
  @media (max-width:1024px){
    body{overflow:auto}.page{height:auto}
    .grid{grid-template-columns:1fr;gap:16px}
    .center{border:1px solid var(--line);border-radius:3px;min-height:66vh}
    .facewrap{height:auto;width:min(100%,330px)}
    .side{border-left:none;border:1px solid var(--line);border-radius:3px;padding:22px 20px 0}
    .side-list,.side-foot{padding-right:0;margin-right:0}
    .hd{padding:18px 20px 0}
  }
  @media (prefers-reduced-motion:reduce){
    *{animation-duration:.001ms !important;transition-duration:.05s !important}
    .draw{stroke-dashoffset:0}.pop,.fade-in{transform:none;opacity:1}
  }
</style>
</head>
<body>
<div class="page">

  <!-- HEADER -->
  <div class="hd">
    <div class="step-tag">STEP 02</div>
    <h1>얼굴 정밀 분석</h1>
    <div class="tabs" id="tabs" role="tablist"></div>
  </div>

  <!-- GRID -->
  <div class="grid">

function summarize(g){
  const avg=g.items.reduce((s,it)=>s+it.pos,0)/g.items.length;
  const tally={};g.items.forEach(it=>tally[it.v]=(tally[it.v]||0)+1);
  const sorted=Object.entries(tally).sort((a,b)=>b[1]-a[1]);
  return {score:Math.round(avg*100),label:sorted[0][0],
    sub:sorted.map(([k,v])=>`${k.toUpperCase()} ${v}`).join(' · ')};
}

/* pos(0~1) -> 3축 분포. 50 = N 기준선에서 멀수록 중립 비중이 줄어듦 */
function distribute(pos,poles){
  const a=Math.min(Math.abs(pos-0.5)*2,1);
  const neutral=Math.round(50-45*a);
  const rest=100-neutral;
  const lead=Math.round(rest*(0.5+a*0.45));
  const lag=100-neutral-lead;
  const hi=pos>=0.5;
  return [
    {name:poles.hi, pct:hi?lead:lag},
    {name:'Neutral', pct:neutral},
    {name:poles.lo, pct:hi?lag:lead}
  ].sort((x,y)=>y.pct-x.pct);
}
function renderInfluence(it,poles){
  document.getElementById('inflTxt').textContent=it.img||'—';
  document.getElementById('tendV').textContent=it.v;
  document.getElementById('tags').innerHTML=(TAGS[it.v]||[]).map(t=>`<span>${t}</span>`).join('');
  const rows=distribute(it.pos,poles);
  const lead=rows[0].name;
  document.getElementById('dist').innerHTML=rows.map(r=>
    `<div class="dr ${r.name===lead?'lead':''}">
       <span class="dr-n">${r.name}</span>
       <span class="dr-b"><i style="width:0%"></i></span>
       <span class="dr-p">${r.pct}%</span>
     </div>`).join('');
  requestAnimationFrame(()=>{
    [...document.querySelectorAll('#dist .dr')].forEach((el,i)=>{
      el.querySelector('i').style.width=rows[i].pct+'%';
    });
  });
}

  [...zoneListEl.children].forEach((el,k)=>el.classList.toggle('on',k===i));
  document.getElementById('zNum').textContent=String(z.num).padStart(2,'0');

  if(z.type==='summary'){ renderSummary(); return; }
  setStage(false);

  const g=GROUPS[z.gi];
  document.getElementById('sideLab').textContent=`ZONE ${String(z.num).padStart(2,'0')} · ${g.name} · ${g.items.length}항목`;
  document.getElementById('sideTitle').textContent=g.panelTitle;
  document.getElementById('sfBtn').textContent='측정 완료';

  /* steps rail */
  stepListEl.innerHTML='';
  g.items.forEach((it,k)=>{
    const b=document.createElement('button');
    b.className='step-i';
    b.innerHTML=`<span class="s-idx">${k+1}.</span><span>${it.title}</span>`;
    b.addEventListener('click',()=>pick(k));
    stepListEl.appendChild(b);
  });

  /* side measures */
  sideListEl.innerHTML='';
  g.items.forEach((it,k)=>{
    const b=document.createElement('button');
    b.className='mi';
    b.innerHTML=`<div class="mi-name">${k+1}. ${it.title}</div>
      <div class="mi-val">현재 값 — <b>${it.value}</b> · ${it.v}</div>
      <div class="bar"><i style="width:0%"></i></div>
      <div class="bar-poles"><span>${it.l}</span><span>${it.r}</span></div>`;
    b.addEventListener('click',()=>pick(k));
    sideListEl.appendChild(b);
  });
  requestAnimationFrame(()=>{
    [...sideListEl.children].forEach((el,k)=>{
      el.querySelector('.bar i').style.width=(g.items[k].pos*100)+'%';
    });
  });
  sideListEl.scrollTop=0;
  pick(0);
}

function pick(k){
  si=k;
  const g=GROUPS[ZONES[zi].gi];
  const it=g.items[k];
  [...stepListEl.children].forEach((el,idx)=>el.classList.toggle('on',idx===k));
  [...sideListEl.children].forEach((el,idx)=>el.classList.toggle('on',idx===k));
  document.getElementById('sNum').textContent=String(k+1).padStart(2,'0');
  document.querySelectorAll('.ov').forEach(o=>o.classList.remove('on'));
  const act=document.getElementById('ov-'+it.id);

  if(el) el.scrollIntoView({block:'nearest',behavior:'smooth'});

/* 축을 화면과 동일하게 3등분. 이 경계 하나가 핀·칸·%를 모두 지배한다 */
const B1=100/3, B2=200/3;
const bandIdx=v=>v<B1?0:(v>B2?2:1);
/* 점수(0~100) -> {low, neutral, high} %. 정중앙 50 = 중립 100%,
   경계(33.3·66.7)에서 중립과 옆이 50:50으로 교차한다. 최댓값 칸 = bandIdx와 항상 일치 */
function axisDist(score){
  const s=Math.max(0,Math.min(100,score));
  let neu;
  if(s<=50) neu = s<=B1 ? (s/B1)*50 : 50+(s-B1)/(50-B1)*50;
  else       neu = s>=B2 ? (100-s)/(100-B2)*50 : 50+(B2-s)/(B2-50)*50;
  let outer=Math.round(100-neu);
  // 칸(bandIdx)이 바깥쪽이면 바깥값이 반드시 중립보다 크도록 보정(부동소수점·경계 동점 방어)
  if(bandIdx(s)!==1 && outer<=100-outer){ outer=51; }
  return {low:s<50?outer:0, neutral:100-outer, high:s>50?outer:0};
}

       '-':'곡선을 더하는 방향 — 라운드 컬과 부드러운 페이스라인으로 각을 감싸 인상을 풀어 줍니다.',
       '0':'형태축은 유지 — 좌우 어느 쪽으로도 밀지 않고 지금의 선을 그대로 살립니다.'},
 prop:{'+':'세로를 세우는 방향 — 톱 볼륨을 올리고 얼굴 여백을 열어 프레임을 또렷하게 잡습니다.',
       '-':'가로를 좁히는 방향 — 볼륨을 눈높이 아래로 내리고 옆선을 감싸 여백을 줄입니다.',
       '0':'비율축은 유지 — 길이와 볼륨 위치를 지금 균형에서 크게 옮기지 않습니다.'}};

const MODE=[
 {k:'강조',en:'EMPHASIZE',
  d:'현재 이미지와 추구 이미지가 같은 칸입니다. 없는 것을 만들 필요가 없으므로, 이미 가진 요소를 더 선명하게 밀어 주는 설계가 가장 효율이 높습니다.',
  h:'시술 강도는 낮게 잡고 디테일(아웃라인 정리·질감 통일)의 완성도로 승부합니다.'},
 {k:'활용',en:'LEVERAGE',
  d:'한 칸 차이입니다. 현재 이미지 안에 목표의 요소가 이미 일부 들어 있으므로, 없는 것을 더하기보다 있는 것의 비중을 옮기는 방식으로 도달합니다.',
  h:'축 하나만 움직이고 나머지 축은 건드리지 않는 편이 결과가 안정적입니다.'},
 {k:'커버',en:'COVER',
  d:'두 칸 이상 떨어져 있습니다. 타고난 요소만으로는 도달하지 않으므로 디자인으로 상쇄해야 하며, 완전한 이동보다 한 칸 당겨오는 것을 1차 목표로 잡는 편이 현실적입니다.',
  h:'한 번에 끌고 가면 어색해집니다. 중간 칸을 1차 목표로 두고 2단계로 나누어 이동시키세요.'}];

/* 고정 순서(W·N·C / S·N·H)의 분포 % — 칸 판정과 동일한 axisDist에서 나온다 */
function spread(score,labels){
  const d=axisDist(score);
  return [{name:labels[0],pct:d.low},{name:labels[1],pct:d.neutral},{name:labels[2],pct:d.high}];
}

const cSummary=document.getElementById('cSummary');
function drawSummaryPanel(){
  const sA=summarize(GROUPS[0]), sB=summarize(GROUPS[1]);
  const c=bandIdx(sA.score), r=bandIdx(sB.score);
  const cur=IMAP[r][c];
  const code=COLC[c]+ROWC[r];

  /* ---------- CENTER : 큰 이미지 맵 ---------- */
  let mp='<div class="bm-head"><i>3×3 IMAGE MAP</i><b>칸을 눌러 추구하는 이미지를 지정하세요</b></div>'
       + '<div class="bmap"><div class="bm-ylab">'+ROWN.map(n=>`<span>${n}</span>`).join('')+'</div>'
       + '<div class="bm-main"><div class="bm-xlab"><span>← WARM</span><span>NEUTRAL</span><span>COOL →</span></div>'
       + '<div class="bm-plot"><div class="bm-grid">';
  for(let i=0;i<3;i++)for(let j=0;j<3;j++){
    const on=(i===r&&j===c), tg=target&&target[0]===i&&target[1]===j;
    mp+=`<button class="bcell${on?' cur':''}${tg?' tgt':''}" data-r="${i}" data-c="${j}">`
      + (on?'<span class="mk">현재</span>':(tg?'<span class="mk">추구</span>':''))
      + `<span class="en">${IMAP[i][j].en}</span><span class="ko">${IMAP[i][j].ko}</span></button>`;
  }
  mp+='</div><span class="bm-pin" style="left:'+sA.score+'%;top:'+sB.score+'%"></span></div></div></div>'
    + `<div class="bm-cap">현재 좌표 · 형태 ${sA.score} × 비율 ${sB.score} → ${code}</div>`;
  cSummary.innerHTML=mp;
  cSummary.querySelectorAll('.bcell').forEach(b=>{
    b.addEventListener('click',()=>{
      const i=+b.dataset.r, j=+b.dataset.c;
      target=(target&&target[0]===i&&target[1]===j)?null:[i,j];
      drawSummaryPanel();
    });
  });

  /* ---------- SIDE : 최종 타입 · 분포 · 방향 ---------- */
  document.getElementById('sideTitle').textContent='최종 이미지 타입';
  const fA=spread(sA.score,['Warm','Neutral','Cool']);
  const fB=spread(sB.score,['Soft','Neutral','Hard']);
  const leadA=Math.max(...fA.map(x=>x.pct)), leadB=Math.max(...fB.map(x=>x.pct));
  const bar=(x,lead)=>`<div class="rs-row${x.pct===lead?' lead':''}"><em>${x.name}</em>
    <div class="rs-bar"><i style="width:${x.pct}%"></i></div><b>${x.pct}%</b></div>`;

  let side=`<div class="rs-code">${code[0]} × ${code[1]}</div>
    <div class="rs-key">${cur.ko}</div>
    <div class="rs-en">${cur.en} TYPE</div>
    <div class="rs-desc">${cur.d}</div>
    <div class="rs-kw">${cur.kw.map((k,i)=>`<span${i<3?' class="on"':''}>${k}</span>`).join('')}</div>
    <div class="rs-sec"><i>형태축 분포 · WARM · NEUTRAL · COOL</i>${fA.map(x=>bar(x,leadA)).join('')}
      <div class="rs-div"></div>
      <i>비율축 분포 · SOFT · NEUTRAL · HARD</i>${fB.map(x=>bar(x,leadB)).join('')}</div>`;

  if(!target){
    side+='<div class="dir-card idle" style="margin-top:26px"><div class="dir-top"><span class="dir-mode">DIRECTION</span><span class="dir-badge">미지정</span></div>'
       +  '<div class="dir-txt">맵에서 추구하는 이미지를 선택하면, 현재 좌표와의 거리로 컨설팅 방향이 <b>강조 · 활용 · 커버</b> 중 하나로 산출됩니다.</div></div>';
  }else{
    const dr=target[0]-r, dc=target[1]-c, dd=Math.max(Math.abs(dr),Math.abs(dc));
    const m=MODE[Math.min(dd,2)], tg=IMAP[target[0]][target[1]];
    side+=`<div class="dir-card" style="margin-top:26px"><div class="dir-top"><span class="dir-mode">${m.en}</span><span class="dir-badge">${m.k}</span></div>
      <div class="dir-path">${code} ${cur.en} → ${COLC[target[1]]+ROWC[target[0]]} ${tg.en} · 이동 거리 ${dd}</div>
      <div class="dir-txt">${m.d}</div>
      <div class="dir-ax"><p><b>형태축</b><span>${AXTXT.form[sgn(dc)]}</span></p>
      <p><b>비율축</b><span>${AXTXT.prop[sgn(dr)]}</span></p></div>
      <div class="dir-hint">${m.h}</div></div>`;
  }
  sideListEl.innerHTML=side;
  requestAnimationFrame(()=>{
    sideListEl.querySelectorAll('.rs-bar i').forEach(el=>{ el.style.width=el.style.width; });
  });
}

function setStage(sum){
  document.querySelector('.c-face').hidden=sum;
  document.getElementById('guideToggle').style.display=sum?'none':'';
  document.querySelector('.c-cap').hidden=sum;
  cSummary.hidden=!sum;
}

function renderSummary(){
  setStage(true);
  document.getElementById('sideLab').textContent=`ZONE ${String(ZONES.length).padStart(2,'0')} · 결과 도출 · 종합`;
  document.getElementById('sNum').textContent='—';
  document.getElementById('sfBtn').textContent='3×3 타입 산출';
  document.querySelectorAll('.ov').forEach(o=>o.classList.remove('on'));
  const sA=summarize(GROUPS[0]), sB=summarize(GROUPS[1]);
  const flow=[
    ['형태축 종합', `${sA.label} · ${sA.score}`],
    ['비율축 종합', `${sB.label} · ${sB.score}`],
    ['최종 타입 산출', `${COLC[bandIdx(sA.score)]}${ROWC[bandIdx(sB.score)]}`],
    ['추구 이미지 지정', '맵에서 선택'],
    ['컨설팅 방향 결정', '강조 · 활용 · 커버']];
  stepListEl.innerHTML=flow.map(([n,v],i)=>
    `<div class="step-i${i<3?' on':''}" style="cursor:default"><span class="s-idx">${i+1}.</span><span>${n}</span></div>`
  ).join('');
  renderInfluence({v:sA.label,pos:sA.score/100,
    img:'형태축 종합 결과이며, 개별 항목의 합산 좌표입니다.'},GROUPS[0].poles);
  drawSummaryPanel();
}

/* guide toggle */
const gt=document.getElementById('guideToggle'), gl=document.getElementById('guideLines');
function setGuide(on){gt.classList.toggle('on',on);gt.setAttribute('aria-checked',on?'true':'false');gl.classList.toggle('on',on);}
setGuide(true);
gt.addEventListener('click',()=>setGuide(!gt.classList.contains('on')));
gt.addEventListener('keydown',e=>{if(e.key===' '||e.key==='Enter'){e.preventDefault();setGuide(!gt.classList.contains('on'));}});

/* keyboard on steps */
stepListEl.addEventListener('keydown',e=>{
  if(ZONES[zi].type!=='measure')return;
  const max=GROUPS[ZONES[zi].gi].items.length-1;
  if(e.key==='ArrowDown'){e.preventDefault();pick(Math.min(si+1,max));stepListEl.children[si].focus();}
  if(e.key==='ArrowUp'){e.preventDefault();pick(Math.max(si-1,0));stepListEl.children[si].focus();}
});

openZone(0);
</script>
</body>
</html>
