# 백엔드 배포 — Lightsail momong-prod-api (2026-10 인프라 이전부터. 예전에는 EB momong-staging)
#
# main 에 backend/ 나 deploy/lightsail/ 가 바뀌면:
#   1) GitHub 에서 Docker 이미지를 빌드해 파일로 만든다
#   2) 서버로 복사해 불러온 뒤 docker compose 로 다시 띄운다
#   3) 서버 안에서 API 가 응답하는지 확인한다
#
# 필요한 GitHub Secrets (Settings → Secrets and variables → Actions)
#   LIGHTSAIL_HOST     서버 고정 IP
#   LIGHTSAIL_USER     ubuntu
#   LIGHTSAIL_SSH_KEY  서버 접속용 개인 키 (Lightsail 콘솔 → 계정 → SSH 키에서 받은 .pem 내용)
# 서버 준비 · 설정값: deploy/lightsail/README.md

name: Deploy Backend (Lightsail)

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - 'deploy/lightsail/**'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch:

concurrency:
  group: deploy-backend
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build image
        run: |
          docker build -t momong-api:latest backend
          docker save momong-api:latest | gzip > momong-api.tar.gz
          ls -lh momong-api.tar.gz

      - name: Prepare SSH
        env:
          SSH_KEY: ${{ secrets.LIGHTSAIL_SSH_KEY }}
          HOST: ${{ secrets.LIGHTSAIL_HOST }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/lightsail.pem
          chmod 600 ~/.ssh/lightsail.pem
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts

      - name: Upload image and compose files
        env:
          HOST: ${{ secrets.LIGHTSAIL_HOST }}
          USER: ${{ secrets.LIGHTSAIL_USER }}
        run: |
          scp -i ~/.ssh/lightsail.pem momong-api.tar.gz deploy/lightsail/docker-compose.yml deploy/lightsail/Caddyfile "$USER@$HOST:~/momong/"

      - name: Load image and restart
        env:
          HOST: ${{ secrets.LIGHTSAIL_HOST }}
          USER: ${{ secrets.LIGHTSAIL_USER }}
        run: |
          ssh -i ~/.ssh/lightsail.pem "$USER@$HOST" 'set -e
            cd ~/momong
            test -f .env.prod || { echo ".env.prod 가 없다 — README 의 서버 준비를 먼저"; exit 1; }
            gunzip -c momong-api.tar.gz | docker load
            rm momong-api.tar.gz
            docker compose up -d
            # Caddyfile 이 바뀌었으면 다시 읽는다 (설정이 틀리면 예전 설정 그대로 두고 배포 실패)
            docker compose exec -T caddy caddy reload --config /etc/caddy/Caddyfile
            docker image prune -f
            for i in $(seq 1 30); do
              if curl -fsS http://127.0.0.1:3200/api/module-configs > /dev/null; then echo "API OK"; exit 0; fi
              sleep 2
            done
            echo "API 가 응답하지 않는다"; docker compose logs --tail=80 api; exit 1'
